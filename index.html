<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>수학 짝꿍</title>
<style>
  :root{
    --ink:#10162B;
    --ink-2:#1A2340;
    --paper:#F2EFE6;
    --pencil:#7C88A8;
    --mint:#5FD3A8;
    --tangerine:#FFB454;
    --coral:#FF7A6B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
    font-size:16px;line-height:1.6;
    overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{font:inherit;color:inherit;cursor:pointer}

  /* ---------- 준비 화면 ---------- */
  #setup{
    position:absolute;inset:0;overflow-y:auto;
    padding:32px 24px 48px;
  }
  #setup h1{
    font-size:34px;font-weight:800;letter-spacing:-.02em;
    margin:8px 0 4px;
  }
  #setup .sub{color:var(--pencil);margin:0 0 28px;font-size:15px}
  .field{margin-bottom:20px}
  .field label{display:block;font-size:14px;color:var(--pencil);margin-bottom:6px}
  .field input,.field select{
    width:100%;padding:13px 14px;
    background:var(--ink-2);border:1px solid #2B3556;border-radius:12px;
    color:var(--paper);font-size:16px;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--mint);outline-offset:1px;border-color:transparent}
  .hint{font-size:13px;color:var(--pencil);margin-top:6px;line-height:1.5}
  .hint a{color:var(--mint)}
  .row{display:flex;gap:12px}
  .row .field{flex:1}
  .start{
    width:100%;margin-top:8px;padding:18px;
    background:var(--mint);color:#0B2A20;border:0;border-radius:14px;
    font-size:19px;font-weight:800;
  }
  .start:disabled{background:#2B3556;color:var(--pencil)}
  .ghost{
    width:100%;margin-top:12px;padding:14px;
    background:transparent;border:1px solid #2B3556;border-radius:14px;
    font-size:15px;color:var(--pencil);
  }

  /* ---------- 세션 화면 ---------- */
  #session{position:absolute;inset:0;display:none}
  #video{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;opacity:.16;filter:saturate(.4);
  }
  #veil{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,transparent 0%,var(--ink) 78%)}
  #ring{
    position:absolute;inset:8px;border-radius:22px;
    border:2px solid #2B3556;transition:border-color .6s ease,box-shadow .6s ease;
    pointer-events:none;
  }
  body.moving #ring{border-color:var(--mint);box-shadow:0 0 22px -6px var(--mint);animation:breathe 3.4s ease-in-out infinite}
  body.nudging #ring{border-color:var(--tangerine);box-shadow:0 0 22px -6px var(--tangerine);animation:none}
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){body.moving #ring{animation:none;opacity:1}}

  #stage{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:24px;
  }
  #clock{
    font-size:96px;font-weight:800;letter-spacing:-.05em;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  #state{margin-top:14px;font-size:19px;color:var(--pencil);min-height:1.6em}
  #speech{
    margin-top:22px;max-width:34ch;font-size:20px;font-weight:600;
    line-height:1.5;color:var(--paper);min-height:3em;
  }
  #dots{margin-top:26px;display:flex;gap:9px}
  #dots i{width:9px;height:9px;border-radius:50%;background:#2B3556;display:block}
  #dots i.on{background:var(--tangerine)}
  #meta{position:absolute;top:24px;left:0;right:0;text-align:center;font-size:13px;color:var(--pencil)}
  #controls{
    position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));
    display:flex;gap:10px;
  }
  #controls button{
    flex:1;padding:17px 10px;border:0;border-radius:14px;font-size:17px;font-weight:700;
    background:var(--ink-2);border:1px solid #2B3556;
  }
  #done{background:var(--paper);color:var(--ink);border-color:transparent}

  /* ---------- 결과 / 요약 ---------- */
  #sheet{
    position:absolute;inset:0;background:var(--ink);
    padding:28px 22px calc(28px + env(safe-area-inset-bottom));
    overflow-y:auto;display:none;
  }
  #sheet h2{font-size:26px;font-weight:800;margin:0 0 18px;letter-spacing:-.02em}
  .card{background:var(--ink-2);border:1px solid #2B3556;border-radius:14px;padding:16px;margin-bottom:12px}
  .card b{display:block;font-size:15px;margin-bottom:4px}
  .card p{margin:0;font-size:15px;color:#C7CEE0}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;margin-right:6px}
  .t-ok{background:rgba(95,211,168,.16);color:var(--mint)}
  .t-no{background:rgba(255,122,107,.16);color:var(--coral)}
  .stat{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #232D4C;font-size:16px}
  .stat:last-child{border-bottom:0}
  .stat span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
  #sheet .start{margin-top:18px}
  .spinner{display:inline-block;width:15px;height:15px;border:2px solid #2B3556;border-top-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- 영역 지정 ---------- */
  #aim{position:absolute;inset:0;display:none;background:#000}
  #aimVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
  #box{position:absolute;border:2px dashed var(--mint);background:rgba(95,211,168,.1);border-radius:6px}
  #aimBar{
    position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));
    background:rgba(16,22,43,.92);border:1px solid #2B3556;border-radius:14px;padding:14px 16px;
  }
  #aimBar p{margin:0 0 12px;font-size:14px;color:#C7CEE0}
  #aimBar button{width:100%;padding:15px;border:0;border-radius:12px;background:var(--mint);color:#0B2A20;font-weight:800;font-size:17px}
</style>
</head>
<body>

<!-- ══════════ 준비 화면 ══════════ -->
<section id="setup">
  <h1>수학 짝꿍</h1>
  <p class="sub">문제집 옆에 폰을 세워두면, 30분 동안 옆에 앉아 있어 줍니다.</p>

  <div class="field">
    <label for="kidName">아이 이름</label>
    <input id="kidName" type="text" placeholder="예: 서연" autocomplete="off">
  </div>

  <div class="field">
    <label for="apiKey">제미나이 API 키</label>
    <input id="apiKey" type="password" placeholder="AIza…" autocomplete="off">
    <p class="hint">aistudio.google.com 에서 무료로 발급합니다. 이 폰에만 저장되고 어디로도 전송되지 않습니다.</p>
  </div>

  <div class="row">
    <div class="field">
      <label for="minutes">세션 길이</label>
      <select id="minutes">
        <option value="15">15분</option>
        <option value="20">20분</option>
        <option value="30" selected>30분</option>
      </select>
    </div>
    <div class="field">
      <label for="model">모델</label>
      <select id="model">
        <option value="gemini-2.5-flash" selected>flash (권장)</option>
        <option value="gemini-2.5-pro">pro</option>
      </select>
    </div>
  </div>

  <button class="start" id="btnAim">문제집 비추고 시작하기</button>
  <button class="ghost" id="btnLog">지난 기록 보기</button>
  <p class="hint" style="margin-top:22px">설정 → 디스플레이 → 자동 잠금을 ‘안 함’으로 두면 중간에 화면이 꺼지지 않습니다.</p>
</section>

<!-- ══════════ 영역 지정 ══════════ -->
<section id="aim">
  <video id="aimVideo" playsinline muted autoplay></video>
  <div id="box"></div>
  <div id="aimBar">
    <p>문제집이 잘 보이게 폰을 맞춘 뒤, 손이 움직이는 부분을 손가락으로 감싸 주세요.</p>
    <button id="btnGo">여기 맞아요</button>
  </div>
</section>

<!-- ══════════ 세션 ══════════ -->
<section id="session">
  <video id="video" playsinline muted autoplay></video>
  <div id="veil"></div>
  <div id="ring"></div>
  <div id="meta"><span id="left"></span></div>
  <div id="stage">
    <div id="clock">0분</div>
    <div id="state">시작해 볼까?</div>
    <div id="speech"></div>
    <div id="dots"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div id="controls">
    <button id="done">다 풀었어요</button>
    <button id="stop">끝내기</button>
  </div>
</section>

<!-- ══════════ 결과 ══════════ -->
<section id="sheet"><div id="sheetBody"></div></section>

<script>
(function(){
"use strict";

/* ───────── 저장소 (실패해도 앱은 동작) ───────── */
var store = {
  get:function(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

var $ = function(id){ return document.getElementById(id); };

/* ───────── 설정값 ───────── */
var CFG = {
  thinkMs   : 40000,   // 이 전에는 절대 말 걸지 않음
  nudge1Ms  : 70000,   // 가벼운 환기
  askAiMs   : 120000,  // AI 판단 (사진 1장)
  maxNudge  : 5,
  sampleMs  : 600,
  motionPct : 0.008    // ROI 픽셀의 0.8% 이상 변하면 '움직임'
};

/* ───────── 상태 ───────── */
var S = {
  stream:null, roi:store.get('roi',{x:.10,y:.20,w:.80,h:.55}),
  name:'', key:'', model:'', endAt:0, startAt:0,
  focusMs:0, bestMs:0, runMs:0,
  lastMove:0, nudges:0, stage:0, busy:false,
  timer:null, sampler:null, prev:null, used:[], graded:[]
};

/* ───────── 말하기 ───────── */
var voiceReady=false;
function speak(text){
  $('speech').textContent = text;
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang='ko-KR'; u.rate=0.96; u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function unlockVoice(){
  try{
    var u=new SpeechSynthesisUtterance(' ');
    u.volume=0; u.lang='ko-KR'; speechSynthesis.speak(u); voiceReady=true;
  }catch(e){}
}

/* ───────── 멘트 (같은 세션에서 반복 안 함) ───────── */
function mins(){ return Math.floor(S.focusMs/60000); }
function nudgeLine(){
  var n=S.name, m=mins();
  var pool = [
    n+'아, 지금까지 '+m+'분 했어. 조금만 더 가보자!',
    n+'아, 연필 어디 갔어? 여기 봐봐.',
    m+'분째야. '+(m+3)+'분까지만 가보자!',
    n+'아, 지금 한 문제만 더 해볼까?',
    '좋아 '+n+'아, 눈은 문제집으로!',
    n+'아, 여기까지 잘 왔어. 이어서 가자.',
    '한 문제만 더 하면 '+(m+2)+'분이야!'
  ];
  var left = pool.filter(function(t){ return S.used.indexOf(t)<0; });
  var pick = (left.length?left:pool)[Math.floor(Math.random()*(left.length?left.length:pool.length))];
  S.used.push(pick);
  return pick;
}

/* ───────── 카메라 ───────── */
function startCam(el){
  return navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} }, audio:false
  }).then(function(st){ S.stream=st; el.srcObject=st; return el.play(); });
}

/* ───────── 영역 지정 ───────── */
function drawBox(){
  var b=$('box'), r=S.roi;
  b.style.left=(r.x*100)+'%'; b.style.top=(r.y*100)+'%';
  b.style.width=(r.w*100)+'%'; b.style.height=(r.h*100)+'%';
}
(function bindDrag(){
  var el=$('aim'), st=null;
  function pt(e){ var t=e.touches?e.touches[0]:e, r=el.getBoundingClientRect();
    return {x:(t.clientX-r.left)/r.width, y:(t.clientY-r.top)/r.height}; }
  el.addEventListener('touchstart',function(e){
    if(e.target.closest('#aimBar')) return;
    st=pt(e);
  },{passive:true});
  el.addEventListener('touchmove',function(e){
    if(!st) return; e.preventDefault();
    var p=pt(e);
    S.roi={ x:Math.min(st.x,p.x), y:Math.min(st.y,p.y),
            w:Math.abs(p.x-st.x), h:Math.abs(p.y-st.y) };
    drawBox();
  },{passive:false});
  el.addEventListener('touchend',function(){
    if(S.roi.w<.1||S.roi.h<.1) S.roi={x:.10,y:.20,w:.80,h:.55};
    drawBox(); st=null; store.set('roi',S.roi);
  });
})();

/* ───────── 움직임 감지 ───────── */
var mCan=document.createElement('canvas'), mCtx;
mCan.width=64; mCan.height=48; mCtx=mCan.getContext('2d',{willReadFrequently:true});

function sample(){
  var v=$('video');
  if(!v.videoWidth) return;
  var r=S.roi, vw=v.videoWidth, vh=v.videoHeight;
  mCtx.drawImage(v, r.x*vw, r.y*vh, r.w*vw, r.h*vh, 0,0,64,48);
  var d=mCtx.getImageData(0,0,64,48).data, cur=new Uint8Array(3072), i, j=0, diff=0;
  for(i=0;i<d.length;i+=4){ cur[j++]=(d[i]*3+d[i+1]*6+d[i+2])>>3; }
  if(S.prev){
    for(i=0;i<3072;i++){ if(Math.abs(cur[i]-S.prev[i])>18) diff++; }
    if(diff/3072 > CFG.motionPct) onMove();
  }
  S.prev=cur;
}
function onMove(){
  S.lastMove=Date.now();
  if(S.stage!==0){ S.stage=0; document.body.classList.remove('nudging'); $('state').textContent='좋아, 그렇게!'; }
  document.body.classList.add('moving');
}

/* ───────── 캡처 → base64 ───────── */
var sCan=document.createElement('canvas'), sCtx=sCan.getContext('2d');
function snapshot(){
  var v=$('video'), w=1024, h=Math.round(w*v.videoHeight/v.videoWidth);
  sCan.width=w; sCan.height=h;
  sCtx.drawImage(v,0,0,w,h);
  return sCan.toDataURL('image/jpeg',0.6).split(',')[1];
}

/* ───────── 제미나이 호출 ───────── */
function ask(prompt, b64){
  var url='https://generativelanguage.googleapis.com/v1beta/models/'+S.model+':generateContent?key='+encodeURIComponent(S.key);
  return fetch(url,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{parts:[{text:prompt},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],
      generationConfig:{temperature:0.4,maxOutputTokens:900,responseMimeType:'application/json'}
    })
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){
    var t=(((j.candidates||[])[0]||{}).content||{}).parts;
    t = t && t[0] ? t[0].text : '';
    return JSON.parse(t.replace(/```json|```/g,'').trim());
  });
}

/* ───────── 2분 정지 → AI 판단 ───────── */
function judge(){
  if(S.busy) return; S.busy=true;
  $('state').textContent='잠깐 볼게…';
  var p =
  '초등 3학년 아이가 수학 문제집을 푸는 장면이다. 아이의 이름은 '+S.name+'.\n'+
  '2분 동안 필기에 변화가 없었다. 사진을 보고 판단하라.\n'+
  '- 상황: "막힘"(문제를 붙들고 있으나 진행이 없음) / "딴짓"(다른 것을 하고 있음) / "자리비움" 중 하나\n'+
  '- 답이나 계산 결과는 절대 말하지 마라. 막힘이면 첫 단추만 한 문장으로 준다. 예: "문제에서 나눠 갖는다는 말이 나오지? 그럼 어떤 계산일까?"\n'+
  '- 지적하거나 다그치지 마라. 이름을 부르고 한 문장으로 짧게 말하라.\n'+
  'JSON으로만 답하라: {"상황":"...","말":"아이에게 들려줄 한 문장"}';
  ask(p, snapshot()).then(function(r){
    speak(r['말'] || nudgeLine());
    $('state').textContent = r['상황']==='막힘' ? '막혔구나' : '집중해 보자';
  }).catch(function(){
    speak(nudgeLine());
  }).then(function(){ S.busy=false; });
}

/* ───────── 채점 ───────── */
function grade(){
  if(S.busy) return; S.busy=true;
  var body=$('sheetBody');
  body.innerHTML='<h2>채점하는 중</h2><div class="card"><p><span class="spinner"></span>문제집을 읽고 있어요.</p></div>';
  $('sheet').style.display='block';
  var p =
  '초등 3학년 수학 문제집 사진이다. 풀이가 보이는 문항만 채점하라.\n'+
  '오답 유형은 반드시 다음 중 하나: "계산 실수"(방법은 맞음) / "문제 오독" / "개념 부족" / "안 풀었음".\n'+
  '한마디는 답을 알려주지 말고 어디를 다시 보면 되는지만 짧게 쓴다. 칭찬은 잘한 부분이 있을 때만 한다.\n'+
  'JSON으로만 답하라: {"문항":[{"번호":"1","정답":true,"유형":"","한마디":""}],"다른풀이":"틀린 문제 하나를 골라 다른 방식으로 접근하는 힌트 한두 문장","총평":"한 문장"}';
  ask(p, snapshot()).then(function(r){
    (r['문항']||[]).forEach(function(q){ if(!q['정답']) S.graded.push(q['유형']||'기타'); });
    var h='<h2>채점 결과</h2>';
    (r['문항']||[]).forEach(function(q){
      h+='<div class="card"><b>'+q['번호']+'번 <span class="tag '+(q['정답']?'t-ok':'t-no')+'">'+
         (q['정답']?'맞았어':(q['유형']||'다시'))+'</span></b><p>'+(q['한마디']||'')+'</p></div>';
    });
    if(r['다른풀이']) h+='<div class="card"><b>이렇게도 풀 수 있어</b><p>'+r['다른풀이']+'</p></div>';
    h+='<button class="start" id="back">계속 풀기</button>';
    body.innerHTML=h;
    $('back').onclick=function(){ $('sheet').style.display='none'; };
    if(r['총평']) speak(r['총평']);
  }).catch(function(e){
    body.innerHTML='<h2>읽지 못했어요</h2><div class="card"><p>문제집이 화면에 다 들어오는지, 그림자가 지지 않는지 확인하고 다시 눌러 주세요. ('+e.message+')</p></div><button class="start" id="back">돌아가기</button>';
    $('back').onclick=function(){ $('sheet').style.display='none'; };
  }).then(function(){ S.busy=false; });
}

/* ───────── 1초 루프 ───────── */
function tick(){
  var now=Date.now(), idle=now-S.lastMove;

  if(idle<2000){ S.focusMs+=1000; S.runMs+=1000; if(S.runMs>S.bestMs) S.bestMs=S.runMs; }
  else { S.runMs=0; document.body.classList.remove('moving'); }

  $('clock').textContent = mins()+'분';
  var leftMs=Math.max(0,S.endAt-now);
  $('left').textContent = Math.ceil(leftMs/60000)+'분 남음 · 오늘 '+(store.get('sessions',0)+1)+'번째';

  if(S.nudges<CFG.maxNudge && !S.busy){
    if(S.stage===0 && idle>CFG.thinkMs){ S.stage=1; $('state').textContent='생각 중이구나'; }
    else if(S.stage===1 && idle>CFG.nudge1Ms){
      S.stage=2; S.nudges++; document.body.classList.add('nudging');
      speak(nudgeLine()); paintDots();
    }
    else if(S.stage===2 && idle>CFG.askAiMs){
      S.stage=3; S.nudges++; paintDots(); judge();
    }
  }
  if(leftMs<=0) finish();
}
function paintDots(){
  var d=$('dots').children;
  for(var i=0;i<d.length;i++) d[i].className = i<S.nudges ? 'on' : '';
}

/* ───────── 종료 ───────── */
function finish(){
  clearInterval(S.timer); clearInterval(S.sampler);
  if(S.stream) S.stream.getTracks().forEach(function(t){ t.stop(); });
  document.body.className='';
  store.set('sessions', store.get('sessions',0)+1);

  var counts={};
  S.graded.forEach(function(t){ counts[t]=(counts[t]||0)+1; });
  var log=store.get('log',[]);
  log.unshift({ d:new Date().toLocaleDateString('ko-KR'),
                focus:Math.round(S.focusMs/60000), best:Math.round(S.bestMs/60000),
                nudges:S.nudges, wrong:counts });
  store.set('log', log.slice(0,60));

  var h='<h2>오늘 이만큼 했어요</h2><div class="card">'+
    '<div class="stat"><span>집중한 시간</span><span>'+Math.round(S.focusMs/60000)+'분</span></div>'+
    '<div class="stat"><span>한 번에 가장 오래</span><span>'+Math.round(S.bestMs/60000)+'분</span></div>'+
    '<div class="stat"><span>말 건 횟수</span><span>'+S.nudges+'회</span></div></div>';
  var keys=Object.keys(counts);
  if(keys.length){
    h+='<div class="card"><b>틀린 이유</b>';
    keys.forEach(function(k){ h+='<div class="stat"><span>'+k+'</span><span>'+counts[k]+'개</span></div>'; });
    h+='</div>';
  }
  h+='<button class="start" id="again">처음으로</button>';
  $('sheetBody').innerHTML=h; $('sheet').style.display='block';
  $('again').onclick=function(){ location.reload(); };
  speak(S.name+'아, 오늘 '+Math.round(S.focusMs/60000)+'분 집중했어. 수고했어!');
}

/* ───────── 화면 전환 ───────── */
$('kidName').value = store.get('name','');
$('apiKey').value  = store.get('key','');

$('btnAim').onclick = function(){
  var n=$('kidName').value.trim(), k=$('apiKey').value.trim();
  if(!n || !k){ alert('이름과 API 키를 모두 입력해 주세요.'); return; }
  store.set('name',n); store.set('key',k);
  S.name=n; S.key=k; S.model=$('model').value;
  unlockVoice();
  $('setup').style.display='none'; $('aim').style.display='block';
  drawBox();
  startCam($('aimVideo')).catch(function(e){
    alert('카메라를 열지 못했습니다. 주소가 https 인지, 카메라 권한을 허용했는지 확인해 주세요.\n'+e.message);
    location.reload();
  });
};

$('btnGo').onclick = function(){
  $('aim').style.display='none'; $('session').style.display='block';
  $('video').srcObject = S.stream;
  $('video').play();
  S.startAt=Date.now(); S.lastMove=Date.now();
  S.endAt = S.startAt + parseInt($('minutes').value,10)*60000;
  S.timer   = setInterval(tick,1000);
  S.sampler = setInterval(sample,CFG.sampleMs);
  speak(S.name+'아, 시작하자. 준비됐지?');
  if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){});
};

$('done').onclick = grade;
$('stop').onclick = function(){ if(confirm('여기서 끝낼까요?')) finish(); };

$('btnLog').onclick = function(){
  var log=store.get('log',[]);
  var h='<h2>지난 기록</h2>';
  if(!log.length) h+='<div class="card"><p>아직 기록이 없어요. 한 번 해보고 다시 오세요.</p></div>';
  log.forEach(function(r){
    h+='<div class="card"><b>'+r.d+'</b><p>집중 '+r.focus+'분 · 최장 '+r.best+'분 · 개입 '+r.nudges+'회</p></div>';
  });
  h+='<button class="start" id="back2">돌아가기</button>';
  $('sheetBody').innerHTML=h; $('sheet').style.display='block';
  $('back2').onclick=function(){ $('sheet').style.display='none'; };
};

})();
</script>
